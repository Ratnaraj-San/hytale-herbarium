plugins {
    id 'java'
    id 'checkstyle'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'com.diffplug.spotless' version '8.1.0'
}

import org.gradle.internal.os.OperatingSystem

ext {
    if (project.hasProperty('hytale_home')) {
        hytaleHome = project.findProperty('hytale_home')
    } else if (System.getenv('HYTALE_HOME')) {
        hytaleHome = System.getenv('HYTALE_HOME')
    } else {
        def os = OperatingSystem.current()
        if (os.isWindows()) {
            hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
        }
        else if (os.isMacOsX()) {
            hytaleHome = "${System.getProperty("user.home")}/Library/Application Support/Hytale"
        }
        else if (os.isLinux()) {
            hytaleHome = "${System.getProperty("user.home")}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"
            if (!file(hytaleHome).exists()) {
                hytaleHome = "${System.getProperty("user.home")}/.local/share/Hytale"
            }
        }
    }
}

def hytaleHomePath = ext.has('hytaleHome') ? hytaleHome : null
def hasHytaleHome = (hytaleHomePath != null) && file(hytaleHomePath).exists()
if (!hasHytaleHome) {
    logger.lifecycle("Hytale install not detected; run configs that launch the server will be skipped. Set -Phytale_home=/path/to/Hytale to enable them.")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Quiet warnings about missing Javadocs.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

spotless {
    java {
        googleJavaFormat('1.28.0').aosp()
        removeUnusedImports()
        importOrder('java', 'javax', 'com', 'org', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '12.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    configProperties = [
        'org.checkstyle.google.suppressionfilter.config': file('config/checkstyle/suppressions.xml').absolutePath
    ]
    maxWarnings = 0
}

// Extracts the compatible Hytale version from the plugin manifest (e.g.
// ">=0.7.5 <0.8.0" gives "0.7.5"), then keeps only major.minor ("0.7") so
// the built jar is named after both the plugin version and the Hytale
// version line it targets, without the patch precision.
def pluginManifest = new groovy.json.JsonSlurper().parseText(file('src/main/resources/manifest.json').text)
def serverVersionMatch = (pluginManifest.ServerVersion ?: '') =~ '>=([0-9]+(?:\\.[0-9]+)*)'
if (!serverVersionMatch.find()) {
    throw new GradleException("Could not parse a '>=x.y.z' Hytale version from ServerVersion '${pluginManifest.ServerVersion}' in manifest.json!")
}
def hytaleVersion = serverVersionMatch.group(1).split('\\.').take(2).join('.')

// Adds the Hytale server as a build dependency, allowing you to reference and
// compile against their code without bundling it. When a local install is
// present, we still use its jar for launching the server in IDE run configs.
dependencies {
    // Use local HytaleServer.jar from libs directory for compilation only.
    // The server provides these classes at runtime, so they are not bundled.
    // runServerJar sets its own classpath from the local Hytale install.
    compileOnly(files("libs/HytaleServer.jar"))

    // Your dependencies here
}

// Downloads the Hytale server jar into libs/ from the official Hytale maven
// repository when it is missing, so a fresh clone compiles without any
// manual setup. The version and channel come from gradle.properties
// (hytale_build and patchline).
tasks.register('downloadServerJar') {
    def serverJar = file('libs/HytaleServer.jar')
    outputs.file(serverJar)
    outputs.upToDateWhen { serverJar.exists() }
    doLast {
        def serverJarUrl = "https://maven.hytale.com/${patchline}/com/hypixel/hytale/Server/${hytale_build}/Server-${hytale_build}.jar"
        logger.lifecycle("Downloading the Hytale server jar from ${serverJarUrl}")
        serverJar.parentFile.mkdirs()
        new URL(serverJarUrl).withInputStream { input ->
            serverJar.withOutputStream { output ->
                output << input
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'downloadServerJar'
}

repositories {
    mavenCentral()
    maven {
        name = "hytale-release"
        url = uri("https://maven.hytale.com/release")
    }
    maven {
        name = "hytale-pre-release"
        url = uri("https://maven.hytale.com/pre-release")
    }
    flatDir {
        dirs 'libs'
    }
}

// Updates the manifest.json file with the latest properties defined in the
// build.properties file. Currently we update the version and if packs are
// included with the plugin.
tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }
        def manifestJson = new groovy.json.JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifestJson))
    }
}

// Makes sure the plugin manifest is up to date.
tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    archiveFileName.set("${rootProject.name}-${version}_${hytaleVersion}.jar")
    mergeServiceFiles()
}

// Ensure the shaded jar is produced during a normal build.
tasks.named('build') {
    dependsOn 'shadowJar'
}

// Verifies that every shipped language file defines the same set of keys as
// the en-US reference, that every translation key referenced from plants.json
// or the Java sources exists in all of them, and that the ICU placeholders
// ({count}, {tier}, {date}, {place}, {total}) of each key match the reference.
tasks.register('checkLanguages') {
    group = 'verification'
    description = 'Audits the plugin language files: key parity, referenced keys and ICU placeholders.'
    inputs.dir('src/main/resources/Server/Languages')
    inputs.file('src/main/resources/plants.json')
    inputs.files(fileTree('src/main/java') { include '**/*.java' })

    doLast {
        def languagesDir = file('src/main/resources/Server/Languages')
        def referenceLocale = 'en-US'
        def referenceFile = file("${languagesDir}/${referenceLocale}/server.lang")
        if (!referenceFile.exists()) {
            throw new GradleException("Missing reference language file: ${referenceFile}")
        }

        // Parses a server.lang file into an ordered key -> value map.
        def parseLang = { File langFile ->
            def entries = new LinkedHashMap()
            langFile.eachLine { raw ->
                def line = raw.trim()
                if (line.isEmpty() || line.startsWith('//')) {
                    return
                }
                def matcher = (line =~ /^([A-Za-z0-9_.]+)\s*=\s*(.*)$/)
                if (matcher.matches()) {
                    entries.put(matcher.group(1), matcher.group(2))
                } else {
                    throw new GradleException("Unparsable line in ${langFile}: ${line}")
                }
            }
            entries
        }

        // Collects the ICU placeholder names a translation value references.
        def placeholderNames = { String value ->
            def names = new TreeSet()
            def matcher = (value =~ /\{(count|tier|date|place|total)\b/)
            while (matcher.find()) {
                names << matcher.group(1)
            }
            names
        }

        def errors = []
        def reference = parseLang(referenceFile)

        def localeFiles = new LinkedHashMap()
        languagesDir.eachDir { dir ->
            def langFile = new File(dir, 'server.lang')
            if (langFile.exists()) {
                localeFiles[dir.name] = parseLang(langFile)
            } else {
                errors << "Missing server.lang for locale ${dir.name}"
            }
        }
        if (localeFiles.isEmpty()) {
            errors << "No language files found in ${languagesDir}"
        }

        // 1. Key parity with the reference locale.
        localeFiles.each { locale, entries ->
            if (locale == referenceLocale) {
                return
            }
            def missing = reference.keySet().findAll { !entries.containsKey(it) }.sort()
            def unknown = entries.keySet().findAll { !reference.containsKey(it) }.sort()
            if (missing) {
                errors << "${locale}: missing keys: ${missing.join(', ')}"
            }
            if (unknown) {
                errors << "${locale}: unknown keys: ${unknown.join(', ')}"
            }
        }

        // 2. Translation keys referenced from plants.json and the Java
        // sources must exist in every locale. Only plugin-owned keys are
        // audited: keys from other namespaces (items.*, map.*, portals.*)
        // are provided by the game's own language files. Category keys are
        // built in code from the plants.json category names, so add them
        // explicitly.
        def plantsFile = file('src/main/resources/plants.json')
        def referenced = new TreeSet()
        ['herbarium\\.[A-Za-z0-9_.]+', 'items\\.[A-Za-z0-9_]+\\.name'].each { pattern ->
            [plantsFile.text, fileTree('src/main/java') { include '**/*.java' }*.text.toList().join('\n')].each { text ->
                def matcher = (text =~ /server\.${pattern}/)
                while (matcher.find()) {
                    referenced << matcher.group()
                }
            }
        }
        referenced.removeIf { it.endsWith('.') }
        referenced.removeIf { !(it.startsWith('server.herbarium.') || it == 'server.items.Herbarium_Journal.name') }
        new groovy.json.JsonSlurper().parseText(plantsFile.text).keySet().each { category ->
            referenced << 'server.herbarium.category.' + category.toLowerCase(Locale.ROOT)
        }

        referenced.each { ref ->
            def key = ref.startsWith('server.') ? ref.substring('server.'.length()) : ref
            localeFiles.each { locale, entries ->
                if (!entries.containsKey(key)) {
                    errors << "${locale}: referenced key not translated: ${key}"
                }
            }
        }

        // 3. ICU placeholders of each key must match the reference locale.
        localeFiles.each { locale, entries ->
            if (locale == referenceLocale) {
                return
            }
            reference.each { key, value ->
                def other = entries.get(key)
                if (other == null || placeholderNames(value as String) == placeholderNames(other as String)) {
                    return
                }
                errors << "${locale}: key ${key} has different ICU placeholders than ${referenceLocale}"
            }
        }

        if (errors) {
            throw new GradleException("Language audit failed:\n  - " + errors.join("\n  - "))
        }
        logger.lifecycle("Language audit passed for ${localeFiles.size()} locales (${reference.size()} keys each).")
    }
}

tasks.named('check') {
    dependsOn 'checkLanguages'
}

// Scans the game's Assets.zip for every generated plant and how to obtain it
// then diffs the result against src/main/resources/plants.json
def scanAssetsZip = hasHytaleHome
        ? file("${hytaleHome}/install/${patchline}/package/game/latest/Assets.zip")
        : null

tasks.register('scanPlantsScan', Exec) {
    group = 'tools'
    description = 'Runs tools/plants/scan_plants.py on the game Assets.zip.'
    workingDir = rootDir
    commandLine 'python3', 'tools/plants/scan_plants.py', scanAssetsZip?.absolutePath ?: 'MISSING_ASSETS_ZIP'
    doFirst {
        if (!hasHytaleHome) {
            throw new GradleException("Hytale install not detected; set hytale_home in ~/.gradle/gradle.properties or pass -Phytale_home=/path/to/Hytale to enable scanPlants.")
        }
        if (!scanAssetsZip.exists()) {
            throw new GradleException("Assets.zip not found at ${scanAssetsZip}")
        }
        logger.lifecycle("Scanning ${scanAssetsZip}")
    }
}

tasks.register('scanPlantsCompare', Exec) {
    group = 'tools'
    description = 'Runs tools/plants/compare_plants.py (diff of the scan against plants.json).'
    dependsOn 'scanPlantsScan'
    workingDir = rootDir
    commandLine 'python3', 'tools/plants/compare_plants.py'
}

tasks.register('scanPlants') {
    group = 'tools'
    description = 'Scans Assets.zip for generated plants and diffs the scan against plants.json. Requires hytale_home (-Phytale_home=/path/to/Hytale).'
    dependsOn 'scanPlantsCompare'
}

if (hasHytaleHome) {
    // Create the working directory to run the server if it does not already exist.
    def serverRunDir = file("$projectDir/run")
    if (!serverRunDir.exists()) {
        serverRunDir.mkdirs()
    }

    def createServerRunArguments = { String srcDir ->
        def programParameters = '--allow-op --disable-sentry --assets="' + "${hytaleHome}/install/$patchline/package/game/latest/Assets.zip".replace('\\', '/') + '"'
        def modPaths = []
        if (includes_pack.toBoolean()) {
            modPaths << srcDir.replace('\\', '/')
        }
        if (load_user_mods.toBoolean()) {
            modPaths << "${hytaleHome}/UserData/Mods".replace('\\', '/')
        }
        if (!modPaths.isEmpty()) {
            programParameters += ' --mods="' + modPaths.join(',') + '"'
        }
        return programParameters
    }

    def serverJar = file("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar")
    def assetsZip = file("$hytaleHome/install/$patchline/package/game/latest/Assets.zip")
    def shadowJarTask = tasks.named('shadowJar')
    def modsDir = file("$serverRunDir/mods")

    tasks.register('runServerJar', JavaExec) {
        dependsOn shadowJarTask
        mainClass = 'com.hypixel.hytale.Main'
        classpath = files(serverJar)
        workingDir = serverRunDir.absolutePath
        standardInput = System.in
        doFirst {
            // Create mods directory and copy plugin JAR
            if (!modsDir.exists()) {
                modsDir.mkdirs()
            }
            // Copy the shadow JAR to mods directory
            def pluginJar = shadowJarTask.get().archiveFile.get().asFile
            copy {
                from pluginJar
                into modsDir
            }
            
            def args = [
                '--allow-op',
                '--disable-sentry',
                "--assets=${assetsZip}".replace('\\', '/')
            ]
            
            // Only add --mods if we need to load user mods
            def modPaths = []
            if (load_user_mods.toBoolean()) {
                def userModsDir = file("${hytaleHome}/UserData/Mods")
                if (userModsDir.exists()) {
                    modPaths << userModsDir.absolutePath.replace('\\', '/')
                }
            }
            if (!modPaths.isEmpty()) {
                args << "--mods=${modPaths.join(',')}"
            }
            
            setArgs(args)
        }
    }

    tasks.register('runServer') {
        dependsOn 'runServerJar'
    }

    // Creates a run configuration in IDEA that will run the Hytale server with
    // your plugin and the default assets.
    idea.project.settings.runConfigurations {
        'HytaleServer'(org.jetbrains.gradle.ext.Application) {
            mainClass = 'com.hypixel.hytale.Main'
            moduleName = project.idea.module.name + '.main'
            programParameters = createServerRunArguments(sourceSets.main.java.srcDirs.first().parentFile.absolutePath)
            workingDirectory = serverRunDir.absolutePath
        }
    }

    // Creates a launch.json file for VSCode with the same configuration
    tasks.register('generateVSCodeLaunch') {
        def vscodeDir = file("$projectDir/.vscode")
        def launchFile = file("$vscodeDir/launch.json")
        doLast {
            if (!vscodeDir.exists()) {
                vscodeDir.mkdirs()
            }
            def programParams = createServerRunArguments("\${workspaceFolder}")
            def launchConfig = [
                    version: "0.2.0",
                    configurations: [
                            [
                                    type: "java",
                                    name: "HytaleServer",
                                    request: "launch",
                                    mainClass: "com.hypixel.hytale.Main",
                                    args: programParams,
                                    cwd: "\${workspaceFolder}/run"
                            ]
                    ]
            ]
            launchFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launchConfig))
        }
    }
} else {
    tasks.register('generateVSCodeLaunch') {
        doLast {
            logger.lifecycle("Skipped VSCode launch configuration because hytale_home is not set or the install path is missing.")
        }
    }
}
